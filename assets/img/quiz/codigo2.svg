<text x="48" y="218" xml:space="preserve" font-family="Consolas,Menlo,monospace" font-size="15" fill="#e6edf3">} <tspan fill="#ff7b72">else</tspan> <tspan fill="#ff7b72">if</tspan> (distancia &gt; limite / <tspan fill="#d2a8ff">2</tspan>) {</text>
