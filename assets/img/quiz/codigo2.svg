<text x="48" y="244" xml:space="preserve" font-family="Consolas,Menlo,monospace" font-size="15" fill="#e6edf3">  <tspan fill="#79c0ff">digitalWrite</tspan>(<tspan fill="#d2a8ff">8</tspan>, <tspan fill="#79c0ff">HIGH</tspan>);      <tspan fill="#8b949e">// pisca</tspan></text>
