<text x="48" y="62" xml:space="preserve" font-family="Consolas,Menlo,monospace" font-size="15" fill="#e6edf3"><tspan fill="#ff7b72">int</tspan> leituraPot = <tspan fill="#79c0ff">analogRead</tspan>(<tspan fill="#79c0ff">A0</tspan>);</text>
